[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-sklearn"
version = "1.1.11"
description = "Federated Learning with PyTorch and Flower (1D CNN on network flow data)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "flwr-datasets[vision]>=0.6.1",
    "torch==2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "sklearnexample.server_app:app"
clientapp = "sklearnexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.01
batch-size = 256
save-model = false
# Where results.json and the model are written; empty means results/<timestamp>
output-dir = ""
